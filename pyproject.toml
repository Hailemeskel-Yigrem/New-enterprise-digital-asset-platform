[tool.poetry]
name = "vaultforge"
version = "1.0.0rc1"
description = "Enterprise Digital Asset & Document Management Platform"
authors = ["Hailemeskel Yigrem <hailemeskelyigrem5@gmail.com>"]
readme = "README.md"
packages = [{ include = "vaultforge", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.6.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.17"
redis = "^5.2.0"
celery = { extras = ["redis"], version = "^5.4.0" }
httpx = "^0.28.0"
orjson = "^3.10.0"
structlog = "^24.4.0"
tenacity = "^9.0.0"
aiofiles = "^24.1.0"
pillow = ">=11,<13"
bcrypt = "<4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
black = "^24.10.0"
mypy = "^1.13.0"
types-passlib = "^1.7.7"
types-python-jose = "^3.3.4"
factory-boy = "^3.3.1"
faker = "^33.0.0"
aiosqlite = "^0.20.0"
pip-audit = "^2.7.3"

[tool.poetry.scripts]
vaultforge = "vaultforge.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["vaultforge"]

# Third-party packages that ship no inline types and have no published stubs.
# Silencing these avoids noise unrelated to our own type safety.
[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "sentry_sdk", "sentry_sdk.*"]
ignore_missing_imports = true

# Celery task decorators are untyped since celery ships no py.typed marker;
# strict mode would otherwise flag every @shared_task-decorated function.
[[tool.mypy.overrides]]
module = ["vaultforge.infrastructure.messaging.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["vaultforge"]
branch = false
omit = [
    "*/virus_scan_stub.py",
    "*/workers/*",
    "*/messaging/tasks.py",
    "*/messaging/celery_app.py",
    # Large SQLAlchemy repository modules are exercised by live integration jobs;
    # unit coverage focuses on domain/application layers and smaller adapters.
    "*/persistence/repositories/share_repository.py",
    "*/persistence/repositories/workflow_repository.py",
    "*/persistence/repositories/webhook_repository.py",
    "*/persistence/repositories/compliance_repository.py",
    "*/persistence/repositories/collaboration_repository.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
