# Prometheus scrape configuration for VaultForge production stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: vaultforge-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: vaultforge-api
          environment: production

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
