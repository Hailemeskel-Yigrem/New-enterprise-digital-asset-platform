services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultforge
      POSTGRES_PASSWORD: vaultforge
      POSTGRES_DB: vaultforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vaultforge
      RABBITMQ_DEFAULT_PASS: vaultforge
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vaultforge:vaultforge@postgres:5432/vaultforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://vaultforge:vaultforge@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      uvicorn vaultforge.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vaultforge:vaultforge@postgres:5432/vaultforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://vaultforge:vaultforge@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - storage_data:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A vaultforge.infrastructure.messaging.celery_app.celery_app worker -l info

  beat:
    build: .
    env_file: .env
    environment:
      CELERY_BROKER_URL: amqp://vaultforge:vaultforge@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: celery -A vaultforge.infrastructure.messaging.celery_app.celery_app beat -l info

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  storage_data:
